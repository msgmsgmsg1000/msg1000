  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <span class="logo-en">강남 더라임</span>
        </a>

      <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="attendance.html">출근부</a>
        <a href="reviews.html">후기</a>
        <a href="profile.html" class="is-active">프로필</a>
        <a href="notice.html">공지사항</a>
        <a href="login.html">로그인</a>
        <a href="signup.html">회원가입</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <a class="back-link" href="profile.html">← 프로필 목록</a>
    <div class="page-hero">
      <h1>프로필 등록</h1>
    </div>

    <form class="auth-form write-form" id="profile-write-form">
      <label>
        제목
        <input type="text" name="title" id="profile-title" maxlength="80" required placeholder="예: 수애" />
      </label>
      <p class="write-author-note" id="profile-author-note">작성자: -</p>
      <input type="hidden" name="author" id="profile-author" />
      <label>
        내용
        <textarea name="body" id="profile-body" required placeholder="프로필 내용을 입력하세요"></textarea>
      </label>
      <button type="submit" class="btn btn-primary auth-submit">등록하기</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 강남더라임</p>
  </footer>

  <script src="js/auth-api.js?v=20260812-11"></script>
