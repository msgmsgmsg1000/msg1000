<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>강남더라임</title>
  <meta name="description" content="강남더라임" />
  <meta name="keywords" content="강남더라임" />
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#050505;color:#fff}
    .gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;text-align:center;padding:24px;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.8)),repeating-linear-gradient(180deg,rgba(255,255,255,.03) 0 2px,rgba(0,0,0,.55) 2px 48px)}
    .brand{margin:0;font-size:clamp(2.2rem,8vw,3.8rem);font-weight:700;letter-spacing:.08em}
    .enter{display:inline-block;margin-top:28px;padding:14px 28px;border:1px solid rgba(255,255,255,.55);color:#fff;text-decoration:none;letter-spacing:.06em;background:rgba(0,0,0,.45)}
    .enter:hover{border-color:#fff;background:rgba(255,255,255,.1)}
  </style>
</head>
<body>
  <main class="gate">
    <div>
      <h1 class="brand">강남더라임</h1>
      <a class="enter" href="https://msgmsgmsg1000.github.io/msg1000/">강남더라임 입장하기</a>
    </div>
  </main>
</body>
</html>
