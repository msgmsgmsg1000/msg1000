<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강남더라임</title>
  <meta name="description" content="강남더라임" />
  <meta name="keywords" content="강남더라임" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #050505;
      color: #fff;
      overflow: hidden;
    }
    .gate {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      isolation: isolate;
    }
    .media {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transform: scale(1.08);
      filter: saturate(0.75) brightness(0.55);
      animation: drift 18s ease-in-out infinite alternate;
    }
    .veil {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,.12) 0%, rgba(0,0,0,.72) 70%),
        linear-gradient(180deg, rgba(0,0,0,.3), rgba(0,0,0,.78));
    }
    .blinds {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: repeat(12, 1fr);
      pointer-events: none;
    }
    .blinds span {
      background: rgba(0,0,0,.38);
      border-bottom: 1px solid rgba(255,255,255,.035);
      transform-origin: center top;
      animation: blind 1.1s ease both;
    }
    .blinds span:nth-child(1) { animation-delay: .02s; }
    .blinds span:nth-child(2) { animation-delay: .06s; }
    .blinds span:nth-child(3) { animation-delay: .1s; }
    .blinds span:nth-child(4) { animation-delay: .14s; }
    .blinds span:nth-child(5) { animation-delay: .18s; }
    .blinds span:nth-child(6) { animation-delay: .22s; }
    .blinds span:nth-child(7) { animation-delay: .26s; }
    .blinds span:nth-child(8) { animation-delay: .3s; }
    .blinds span:nth-child(9) { animation-delay: .34s; }
    .blinds span:nth-child(10) { animation-delay: .38s; }
    .blinds span:nth-child(11) { animation-delay: .42s; }
    .blinds span:nth-child(12) { animation-delay: .46s; }
    .panel {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 28px 20px;
      animation: rise .9s ease .35s both;
    }
    .brand {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4.2rem);
      font-weight: 700;
      letter-spacing: .08em;
      line-height: 1.15;
      text-shadow: 0 8px 40px rgba(0,0,0,.55);
    }
    .sub {
      margin: 14px 0 0;
      font-size: .98rem;
      letter-spacing: .18em;
      color: rgba(255,255,255,.72);
    }
    .enter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 34px;
      min-width: min(280px, 78vw);
      padding: 16px 28px;
      border: 1px solid rgba(255,255,255,.55);
      background: rgba(0,0,0,.45);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: .06em;
      text-decoration: none;
      backdrop-filter: blur(6px);
      transition: background .25s ease, border-color .25s ease, transform .25s ease;
      animation: glow 2.8s ease-in-out infinite;
    }
    .enter:hover {
      background: rgba(255,255,255,.12);
      border-color: #fff;
      transform: translateY(-2px);
    }
    @keyframes blind {
      from { transform: scaleY(1.15); opacity: .95; }
      to { transform: scaleY(1); opacity: 1; }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes drift {
      from { transform: scale(1.08) translate3d(0,0,0); }
      to { transform: scale(1.14) translate3d(0,-1.5%,0); }
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 rgba(255,255,255,0); }
      50% { box-shadow: 0 0 28px rgba(255,255,255,.12); }
    }
    @media (prefers-reduced-motion: reduce) {
      .media img, .blinds span, .panel, .enter { animation: none; }
    }
  </style>
</head>
<body>
  <main class="gate" aria-label="강남더라임 입장">
    <div class="media" aria-hidden="true">
      <img src="images/bg.jpg" alt="" />
      <div class="veil"></div>
      <div class="blinds">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
    </div>
    <div class="panel">
      <h1 class="brand">강남더라임</h1>
      <p class="sub">힐링을 위한 안식처</p>
      <a class="enter" href="https://msgmsgmsg1000.github.io/msg1000/">강남더라임 입장하기</a>
    </div>
  </main>
</body>
</html>
