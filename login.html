<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>강남더라임</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <span class="logo-en">강남 더라임</span>
        </a>

      <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="attendance.html">출근부</a>
        <a href="reviews.html">후기</a>
        <a href="profile.html">프로필</a>
        <a href="notice.html">공지사항</a>
        <a href="login.html" class="is-active">로그인</a>
        <a href="signup.html">회원가입</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="page-hero">
      <h1>로그인</h1>
    </div>

    <form class="auth-form" id="login-form">
      <label>
        아이디
        <input type="text" name="username" autocomplete="username" required minlength="4" maxlength="20" />
      </label>
      <label>
        비밀번호
        <input type="password" name="password" autocomplete="current-password" required minlength="6" />
      </label>
      <p class="auth-error" id="login-error" hidden></p>
      <button type="submit" class="btn btn-primary auth-submit">로그인</button>
      <p class="auth-switch">계정이 없으신가요? <a href="signup.html">회원가입</a></p>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 강남더라임</p>
  </footer>

  <script src="js/auth-api.js?v=20260811-20"></script>
  <script src="js/admin-mode.js?v=20260811-20"></script>
  <script src="js/main.js?v=20260811-20"></script>
  <script src="js/auth-ui.js?v=20260811-20"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const errorEl = document.getElementById("login-error");
      const btn = form.querySelector('button[type="submit"]');
      errorEl.hidden = true;
      btn.disabled = true;
      try {
        const user = await loginUser({
          username: form.username.value.trim(),
          password: form.password.value,
        });
        setAdminMode(user.role === "admin");
        applyAdminVisibility();
        const next = new URLSearchParams(location.search).get("next");
        const safeNext =
          next && !/^https?:/i.test(next) && !next.startsWith("//") ? next : "index.html";
        window.location.href = safeNext;
      } catch (err) {
        errorEl.textContent = err.message || "로그인에 실패했습니다.";
        errorEl.hidden = false;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
