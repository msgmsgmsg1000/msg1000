<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>강남더라임</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <span class="logo-en">강남 더라임</span>
        </a>

      <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="attendance.html">출근부</a>
        <a href="reviews.html">후기</a>
        <a href="profile.html">프로필</a>
        <a href="notice.html">공지사항</a>
        <a href="login.html">로그인</a>
        <a href="signup.html" class="is-active">회원가입</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="page-hero">
      <h1>회원가입</h1>
    </div>

    <form class="auth-form" id="signup-form">
      <label>
        아이디
        <input type="text" name="username" autocomplete="username" required minlength="4" maxlength="20" pattern="[A-Za-z0-9_]{4,20}" title="영문, 숫자 텍스트를 4자 이상으로 늘려주세요" />
      </label>
      <label>
        비밀번호
        <input type="password" name="password" autocomplete="new-password" required minlength="6" maxlength="72" title="비밀번호는 6자 이상 입력해 주세요." />
      </label>
      <label>
        비밀번호 확인
        <input type="password" name="passwordConfirm" autocomplete="new-password" required minlength="6" maxlength="72" title="비밀번호는 6자 이상 입력해 주세요." />
      </label>
      <label>
        닉네임
        <input type="text" name="nickname" required minlength="2" maxlength="20" title="닉네임은 2~20자" />
      </label>
      <p class="auth-error" id="signup-error" hidden></p>
      <button type="submit" class="btn btn-primary auth-submit">회원가입</button>
      <p class="auth-switch">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 강남더라임</p>
  </footer>

  <script src="js/auth-api.js?v=20260811-20"></script>
  <script src="js/admin-mode.js?v=20260811-20"></script>
  <script src="js/main.js?v=20260811-20"></script>
  <script src="js/auth-ui.js?v=20260811-20"></script>
  <script>
    const signupForm = document.getElementById("signup-form");
    const usernameInput = signupForm.username;
    const USERNAME_MSG = "영문, 숫자 텍스트를 4자 이상으로 늘려주세요";

    const syncUsernameValidity = () => {
      const value = usernameInput.value.trim();
      const ok = /^[A-Za-z0-9_]{4,20}$/.test(value);
      usernameInput.setCustomValidity(ok ? "" : USERNAME_MSG);
    };

    usernameInput.addEventListener("input", syncUsernameValidity);
    usernameInput.addEventListener("invalid", syncUsernameValidity);
    syncUsernameValidity();

    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const errorEl = document.getElementById("signup-error");
      const btn = form.querySelector('button[type="submit"]');
      errorEl.hidden = true;

      syncUsernameValidity();
      if (!form.reportValidity()) return;

      if (form.password.value !== form.passwordConfirm.value) {
        errorEl.textContent = "비밀번호가 일치하지 않습니다.";
        errorEl.hidden = false;
        return;
      }

      btn.disabled = true;
      try {
        const user = await signupUser({
          username: form.username.value.trim(),
          password: form.password.value,
          nickname: form.nickname.value.trim(),
        });
        setAdminMode(user.role === "admin");
        applyAdminVisibility();
        alert("회원가입이 완료되었습니다.");
        const next = new URLSearchParams(location.search).get("next");
        const safeNext =
          next && !/^https?:/i.test(next) && !next.startsWith("//") ? next : "index.html";
        window.location.href = safeNext;
      } catch (err) {
        errorEl.textContent = err.message || "회원가입에 실패했습니다.";
        errorEl.hidden = false;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
